<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171715">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Reset password | ARMIAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Italiana&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="reset-password.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js" defer></script>
  <script src="supabase.js" defer></script>
  <script src="reset-password.js" defer></script>
</head>
<body class="admin-body">
  <main class="login-screen reset-screen">
    <div class="login-brand"><span class="login-mark">ARMIAG<span>.</span></span><span class="login-caption">Private administration</span></div>
    <section class="login-card reset-card" aria-labelledby="resetTitle">
      <span class="eyebrow">ACCOUNT SECURITY</span>
      <h1 id="resetTitle">Choose a new password</h1>
      <p id="resetIntro">Verifying your secure recovery link…</p>
      <p class="form-message reset-message" id="resetMessage" role="status" aria-live="polite"></p>
      <form id="resetForm" hidden>
        <label>New password<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
        <label>Confirm new password<input type="password" name="confirmPassword" autocomplete="new-password" minlength="8" required></label>
        <p class="password-hint">Use at least 8 characters.</p>
        <button class="button button-gold" id="savePasswordButton" type="submit">Save new password</button>
      </form>
      <a class="reset-login-link" id="adminLoginLink" href="admin.html">Return to administrator sign in</a>
    </section>
    <a class="back-link" href="index.html">Return to the storefront</a>
  </main>
</body>
</html>
